# askfirst rules and modes.
#
# Every rule belongs to a mode and applies only while that mode is active.
# Nothing sits above the modes: a boundary you want everywhere is written into
# each mode that should have it, so the mode you are in is the whole answer.
#
# Inside a mode, rules are grouped by what they do. When several match, the
# firmest wins: allow < pass < agent < ask < deny. Between two equally firm
# matches the more specific pattern is the one quoted back to you.
#
#   allow  run without asking (in auto mode this also skips the classifier)
#   pass   say nothing and let Claude Code's own flow decide
#   agent  hand the whole command to the judge, which answers allow/ask/deny
#          against this mode's entry in policy.toml
#   ask    prompt, every time
#   deny   refuse, and tell the model why
#
# allow and pass are lists of patterns: neither needs anything said about it.
# ask and deny map a pattern to one sentence, which is what you see when the
# call stops and what the model is told about it. agent maps a pattern to an
# extra line of policy for the judge, about that pattern alone; leave it empty
# for none.
#
# A pattern is matched word by word against the command. `*` matches one word,
# and a trailing `*` matches any remaining words, so `git push *` covers a bare
# `git push`.

default_mode = "contributor"

# What happens to a signature with no rule and no verdict, when the mode does
# not say.
#   ask    stop once, queue it for `askfirst review`  (instant)
#   agent  judge every new command                    (6-8s each, see below)
#   pass   observe only, decide nothing
#
# `ask` rather than `agent`: a judged call costs 6 to 8 seconds, which is worse
# than answering a prompt when you are sitting here. Let the queue build and
# clear it in one go with `askfirst review --agent`.
unseen = "ask"

# askfirst's own commands are the exception to all of this. They ask, in every
# mode, whatever `unseen` says, unless a rule names them: put `askfirst mode *`
# in a group to decide it yourself. A catch-all `*` does not count, since it is
# written about other commands. Without the exception a mode with
# `unseen = "deny"` would refuse `askfirst mode <name>`, the only command that
# leaves that mode, and never prompt.

# The judge used by an `agent` rule, by `unseen = "agent"` and by
# `askfirst review --agent`. It is called `judge` because `agent` is an action.
[judge]
model = "haiku"
timeout_secs = 20      # the PreToolUse hook timeout must be comfortably above this
# command = "claude"   # only for a judge that is not the Claude CLI
# args = []            # set these and `model` is ignored

# ---------------------------------------------------------------------------
# reader: investigate and explain. Nothing that changes state.
# ---------------------------------------------------------------------------

[modes.reader]
description = "Read and investigate. Anything that changes state is refused."
# Strict on purpose: in this mode an uncategorised command is a mistake rather
# than a question, so it refuses instead of interrupting you.
unseen = "deny"
allow = [
  "git status *",
  "git log *",
  "git diff *",
  "git show *",
  "git blame *",
  "cargo tree *",
  "cargo metadata *",
  # Programs that read and print. These used to ship as seeded verdicts in a
  # separate file; they are rules now, in the modes they belong to.
  "basename *",
  "cat *",
  "cmp *",
  "column *",
  "cut *",
  "date *",
  "df *",
  "diff *",
  "dirname *",
  "du *",
  "echo *",
  "false *",
  "file *",
  "grep *",
  "groups *",
  "head *",
  "hostname *",
  "id *",
  "jq *",
  "less *",
  "locale *",
  "ls *",
  "man *",
  "md5 *",
  "printf *",
  "pwd *",
  "realpath *",
  "rg *",
  "shasum *",
  "sleep *",
  "sort *",
  "stat *",
  "tail *",
  "tput *",
  "tr *",
  "tree *",
  "true *",
  "type *",
  "uname *",
  "uniq *",
  "uptime *",
  "wc *",
  "which *",
  "whoami *",
]

# Writing is what this mode exists to prevent, so say so rather than letting it
# fall through to the unseen default with a vaguer message.
[modes.reader.deny]
"git commit *" = "reader mode does not commit. It investigates without changing anything: report what you found, and let the user switch to contributor mode if they want the change made."
"git add *" = "reader mode does not stage changes. Describe the change you would make instead."
# Whatever the program or alias: git, dot, gj, hg, jj. This covers a force push
# too, so reader needs no separate rule for one.
"* push *" = "reader mode never publishes. Do not push; tell the user what you would have pushed."

# ---------------------------------------------------------------------------
# contributor: edit, build, test, commit. Publishing and discarding still ask.
# ---------------------------------------------------------------------------

[modes.contributor]
description = "Edit, build, test and commit. Publishing and discarding still ask."
unseen = "ask"
allow = [
  "cargo build *",
  "cargo test *",
  "cargo check *",
  "cargo clippy *",
  "cargo fmt *",
  "git add *",
  "git commit *",
  "git checkout *",
  "git switch *",
  "git fetch *",
  "git pull *",
  # The same read-only programs reader allows: printing a file is no less safe
  # in a mode that is also allowed to write one.
  "basename *",
  "cat *",
  "cmp *",
  "column *",
  "cut *",
  "date *",
  "df *",
  "diff *",
  "dirname *",
  "du *",
  "echo *",
  "false *",
  "file *",
  "grep *",
  "groups *",
  "head *",
  "hostname *",
  "id *",
  "jq *",
  "less *",
  "locale *",
  "ls *",
  "man *",
  "md5 *",
  "printf *",
  "pwd *",
  "realpath *",
  "rg *",
  "shasum *",
  "sleep *",
  "sort *",
  "stat *",
  "tail *",
  "tput *",
  "tr *",
  "tree *",
  "true *",
  "type *",
  "uname *",
  "uniq *",
  "uptime *",
  "wc *",
  "which *",
  "whoami *",
]

[modes.contributor.ask]
# Whatever the program or alias: git, dot, gj, hg, jj.
"* push *" = "Pushing publishes work. Confirm the remote and branch with the user, whatever the program or alias. Wait for their answer; do not retry through a script, a wrapper or a different spelling."
# Destructive even in a mode that is allowed to change things.
"git reset --hard *" = "This discards uncommitted work. Confirm with the user what would be lost before running it."
"git clean *" = "This deletes untracked files."
"git stash *" = "Stashing can hide uncommitted work."

[modes.contributor.deny]
# --force and -f are different strings. A rule naming only one of them is the
# trap the Claude Code docs warn about, so both are listed.
"git push --force *" = "Force push rewrites published history, so it is refused. Use --force-with-lease and ask the user first, or rebase locally and push normally."
"git push -f *" = "Force push rewrites published history, so it is refused. Use --force-with-lease and ask the user first, or rebase locally and push normally."

# Interpreters: the signature says nothing about what will actually run, so the
# judge reads the whole command. These are the calls worth 6 seconds. The value
# is an extra line for the judge about this pattern; empty means the mode's
# policy is all it gets.
[modes.contributor.agent]
"python3 *" = ""
"python *" = ""
"node *" = ""
"npx *" = "npx fetches a package from the network and runs it. Allow a pinned, well-known package that only builds or formats; anything unfamiliar or unpinned is ask."
"uvx *" = "uvx fetches a package from the network and runs it. Allow a pinned, well-known package that only builds or formats; anything unfamiliar or unpinned is ask."

# ---------------------------------------------------------------------------
# godmode: get out of the way.
#
# Its meaning is fixed in the binary, not here: it allows everything, and the
# entry below supplies only the description. The one thing it does not switch
# off is the self-guard, which is compiled in, so changing askfirst's own
# config or running askfirst still asks. That is what keeps godmode reversible.
# ---------------------------------------------------------------------------

[modes.godmode]
description = "Everything runs. The self-guard still applies."
unseen = "pass"
