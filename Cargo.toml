[package]
name = "askfirst"
version = "0.1.0"
edition = "2021"
description = "A PreToolUse hook for Claude Code that learns what you allow"
repository = "https://github.com/Jgfrausing/askfirst"
license = "MIT"
readme = "README.md"
keywords = ["claude-code", "hook", "permissions", "agent", "guardrail"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete_command = "0.6"
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"

[profile.release]
opt-level = 2
lto = true
strip = true
